{% extends "base.html" %}
{% block title %}Login · Encrypted Cloud{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4 card-file">
      <h4 class="mb-3">Sign in</h4>
      <form method="post" novalidate>
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input name="username" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input name="password" type="password" class="form-control" required>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <button class="btn btn-primary" type="submit"><i class="bi bi-box-arrow-in-right"></i> Login</button>
          <a href="{{ url_for('register') }}" class="small-muted">Create an account</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
